name: eraktkosh-snapshot

on:
  schedule:
    # Wake up every hour, at minute 7 (off the busy :00 mark, where GitHub tends to drop jobs).
    # The gate job below only lets a wake-up through when the newest snapshot is old enough, so
    # data still refreshes about every 4 hours, but one dropped trigger now costs an hour rather
    # than a whole cycle. (A plain "0 */4 * * *" cron was in practice running every ~6 hours.)
    # The numbers live in pipeline/schedule.py and are published to the website's countdown.
    - cron: "7 * * * *"
  workflow_dispatch: {}  # lets you trigger a run manually from the Actions tab; always goes ahead

# one run at a time, so two runs never race each other's commits
concurrency:
  group: eraktkosh-snapshot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - uses: actions/checkout@v4
      - id: gate
        run: python3 -m pipeline.gate

  scrape:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        run: python scrape.py

      # Save the raw snapshot first, so a modelling problem can never lose data.
      - name: Commit snapshot
        run: |
          git config user.name "eraktkosh-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/
          git diff --quiet --cached || git commit -m "snapshot $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git pull --rebase
          git push

      # Rebuild the forecast from the whole archive. If this step fails, the site keeps
      # showing the previous web/data/forecast.json.
      - name: Build forecast
        run: python -m pipeline.run

      - name: Commit forecast
        run: |
          git add web/data/forecast.json
          git diff --quiet --cached || git commit -m "forecast $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git pull --rebase
          git push

      # Tell Vercel to publish the commit we just pushed (no-op until the secret exists).
      - name: Deploy site
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then echo "VERCEL_DEPLOY_HOOK secret not set; skipping"; exit 0; fi
          curl -fsS -X POST "$HOOK"
