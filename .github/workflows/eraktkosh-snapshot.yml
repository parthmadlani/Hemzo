name: eraktkosh-snapshot

on:
  schedule:
    # Every 4 hours (00:00, 04:00, 08:00, 12:00, 16:00, 20:00 UTC) — GitHub
    # Actions cron is "best effort" and can run a few minutes late under
    # load; that's fine at this granularity.
    - cron: "0 */4 * * *"
  workflow_dispatch: {}  # lets you trigger a run manually from the Actions tab, for testing

# one run at a time, so two runs never race each other's commits
concurrency:
  group: eraktkosh-snapshot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        run: python scrape.py

      # Save the raw snapshot first, so a modelling problem can never lose data.
      - name: Commit snapshot
        run: |
          git config user.name "eraktkosh-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/
          git diff --quiet --cached || git commit -m "snapshot $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git pull --rebase
          git push

      # Rebuild the forecast from the whole archive. If this step fails, the site keeps
      # showing the previous web/data/forecast.json.
      - name: Build forecast
        run: python -m pipeline.run

      - name: Commit forecast
        run: |
          git add web/data/forecast.json
          git diff --quiet --cached || git commit -m "forecast $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git pull --rebase
          git push

      # Tell Vercel to publish the commit we just pushed (no-op until the secret exists).
      - name: Deploy site
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then echo "VERCEL_DEPLOY_HOOK secret not set; skipping"; exit 0; fi
          curl -fsS -X POST "$HOOK"
